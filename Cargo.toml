[package]
name = "hascheevos"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
bkt = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# 7-Zip offers LZMA2, LZMA, PPMd and BZip2 for .7z; the first two are always on.
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd"] }
tempfile = "3"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
bindgen = "0.73"

[build-dependencies]
cc = "1"
