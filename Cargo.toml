[package]
name = "hascheevos"
version = "0.1.0"
edition = "2021"
description = "Tells whether a ROM is supported by RetroAchievements"

[[bin]]
name = "hc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
bindgen = "0.73"
cc = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
