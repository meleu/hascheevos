pre-commit:
  jobs:
    - name: rustfmt
      glob: "*.rs"
      # Generated by bindgen, and tests/bindings.rs compares it byte for byte.
      exclude:
        - src/rc_hash/bindings.rs
      # rustfmt ignores Cargo.toml, so the edition has to be passed explicitly.
      run: rustfmt --edition 2024 {staged_files}
      stage_fixed: true

    - name: test
      glob:
        - "*.rs"
        - Cargo.toml
        - Cargo.lock
        - vendor/rcheevos
        - "testdata/**"
      run: cargo test
